<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Session Switcher">
  <defs>
    <clipPath id="frame">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
    <linearGradient id="surface" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#101a2a"/>
      <stop offset=".6" stop-color="#0d1622"/>
      <stop offset="1" stop-color="#0b1420"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="52" cy="6" r="40">
      <stop offset="0" stop-color="#4ea1ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#4ea1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="url(#surface)"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <!-- back session card -->
    <rect x="15" y="12" width="34" height="24" rx="6" fill="#173252" stroke="#3c6ea3" stroke-width="1.5"/>
    <rect x="21" y="18" width="14" height="2.5" rx="1.25" fill="#7fb6ee" opacity=".85"/>
    <rect x="21" y="24" width="20" height="2.5" rx="1.25" fill="#5b8fc4" opacity=".55"/>
    <!-- front session card -->
    <rect x="13" y="26" width="38" height="26" rx="7" fill="#1d3f66" stroke="#79b2e8" stroke-width="1.75"/>
    <rect x="19" y="33" width="16" height="3" rx="1.5" fill="#cfe6ff"/>
    <rect x="19" y="40" width="24" height="3" rx="1.5" fill="#8fbde8" opacity=".7"/>
    <!-- cycle arrows -->
    <path d="M45 32.5c2.6 1.9 3.4 5.7 1.7 8.6" fill="none" stroke="#68d6c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M45.2 44.6l1.7-3.6 3.6 1.6" fill="none" stroke="#68d6c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 48.5c-2.6-1.9-3.4-5.7-1.7-8.6" fill="none" stroke="#68d6c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M18.8 36.4l-1.7 3.6-3.6-1.6" fill="none" stroke="#68d6c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#9cc7f2" stroke-opacity=".26" stroke-width="1.5"/>
  </g>
</svg>
